<svg viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="jobpilot — the work remembers, let it speak">
  <defs>
    <radialGradient id="mist" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D9D7D4" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#D9D7D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D9D7D4" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#D9D7D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#191712"/>
      <stop offset="55%" stop-color="#100E08"/>
      <stop offset="100%" stop-color="#0A0801"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .85  0 0 0 0 .84  0 0 0 0 .83  0 0 0 .05 0"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <style>
    .ch { font-family: Georgia, 'Times New Roman', serif; font-size: 78px; fill: #D9D7D4;
          opacity: 0; transform: translateY(34px);
          animation: rise 1.3s cubic-bezier(.16,1,.3,1) forwards; }
    .t1{animation-delay:.15s}.t2{animation-delay:.22s}.t3{animation-delay:.29s}.t4{animation-delay:.36s}
    .t5{animation-delay:.43s}.t6{animation-delay:.50s}.t7{animation-delay:.57s}.t8{animation-delay:.64s}
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }

    .tag { font-family: Georgia, serif; font-size: 17px; letter-spacing: 7px; fill: #8C8A85;
           opacity: 0; animation: fade 1.6s ease .9s forwards; text-transform: uppercase; }
    @keyframes fade { to { opacity: 1; } }

    .hair { stroke: #3A3830; stroke-width: 1; transform-origin: 600px 0;
            transform: scaleX(0); animation: draw 1.4s cubic-bezier(.65,0,.35,1) 1.1s forwards; }
    @keyframes draw { to { transform: scaleX(1); } }

    .enso { fill: none; stroke: #D9D7D4; stroke-width: 3.4; stroke-linecap: round;
            stroke-dasharray: 300; stroke-dashoffset: 300; opacity: .9;
            animation: ink 2.2s cubic-bezier(.65,0,.35,1) .4s forwards; }
    @keyframes ink { to { stroke-dashoffset: 40; } }

    .m1 { animation: driftA 26s ease-in-out infinite alternate; }
    .m2 { animation: driftB 19s ease-in-out infinite alternate; }
    .m3 { animation: driftA 33s ease-in-out infinite alternate-reverse; }
    @keyframes driftA { from { transform: translateX(-70px); } to { transform: translateX(90px); } }
    @keyframes driftB { from { transform: translateX(60px); }  to { transform: translateX(-80px); } }

    .breathe { animation: breathe 7s ease-in-out infinite; transform-origin: 1084px 96px; }
    @keyframes breathe { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
  </style>

  <rect width="1200" height="340" fill="url(#sky)"/>

  <!-- far light breach -->
  <ellipse cx="220" cy="60" rx="340" ry="150" fill="url(#glow)"/>

  <!-- drifting mist banks -->
  <g class="m1"><ellipse cx="320" cy="150" rx="330" ry="60" fill="url(#mist)"/></g>
  <g class="m2"><ellipse cx="820" cy="210" rx="380" ry="55" fill="url(#mist)"/></g>
  <g class="m3"><ellipse cx="560" cy="110" rx="290" ry="45" fill="url(#mist)"/></g>

  <!-- far treeline -->
  <g filter="url(#soft)" opacity=".8">
    <path fill="#14120C" d="M0 262 L18 250 L30 262 L44 240 L58 262 L76 246 L92 262 L110 236 L128 262 L150 248 L166 262 L188 238 L206 262 L228 250 L244 262 L262 242 L280 262 L304 234 L324 262 L348 248 L364 262 L386 240 L404 262 L426 252 L442 262 L462 238 L482 262 L508 246 L526 262 L548 236 L568 262 L592 250 L610 262 L632 240 L652 262 L676 248 L694 262 L718 234 L740 262 L764 250 L782 262 L806 242 L826 262 L850 236 L872 262 L896 248 L914 262 L938 238 L958 262 L982 250 L1000 262 L1024 240 L1044 262 L1070 248 L1088 262 L1112 236 L1134 262 L1158 250 L1176 262 L1200 244 L1200 340 L0 340 Z"/>
  </g>
  <!-- near treeline -->
  <path fill="#0A0801" d="M0 300 L24 282 L40 300 L62 272 L84 300 L112 284 L132 300 L158 268 L184 300 L214 286 L236 300 L264 274 L290 300 L322 284 L344 300 L372 266 L400 300 L432 286 L456 300 L486 272 L512 300 L546 284 L568 300 L598 268 L626 300 L658 286 L682 300 L712 272 L740 300 L774 284 L798 300 L830 266 L858 300 L892 286 L916 300 L948 272 L976 300 L1010 284 L1034 300 L1066 268 L1094 300 L1128 286 L1152 300 L1182 278 L1200 292 L1200 340 L0 340 Z"/>

  <!-- mist over the trees -->
  <g class="m2" opacity=".8"><ellipse cx="600" cy="284" rx="520" ry="42" fill="url(#mist)"/></g>

  <!-- wordmark, letter by letter -->
  <g>
    <text class="ch t1" x="356" y="172">j</text>
    <text class="ch t2" x="398" y="172">o</text>
    <text class="ch t3" x="440" y="172">b</text>
    <text class="ch t4" x="484" y="172">p</text>
    <text class="ch t5" x="528" y="172">i</text>
    <text class="ch t6" x="552" y="172">l</text>
    <text class="ch t7" x="576" y="172">o</text>
    <text class="ch t8" x="620" y="172">t</text>
  </g>
  <text class="tag" x="600" y="216" text-anchor="middle">the work remembers · let it speak</text>
  <line class="hair" x1="440" y1="242" x2="760" y2="242"/>

  <!-- brush enso, drawing itself -->
  <g class="breathe">
    <path class="enso" d="M 1110 66 A 34 34 0 1 0 1117 94"/>
    <line x1="1070" y1="110" x2="1098" y2="86" stroke="#D9D7D4" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  </g>

  <rect width="1200" height="340" filter="url(#grain)" opacity=".5"/>
</svg>
